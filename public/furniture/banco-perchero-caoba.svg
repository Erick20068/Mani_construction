<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  
  <defs>
    <linearGradient id="bg-bancopercherocaoba" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="60%" stop-color="#F1EBE1"/>
      <stop offset="100%" stop-color="#E5DDD0"/>
    </linearGradient>

    <linearGradient id="wood-bancopercherocaoba" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="55%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="wood-h-bancopercherocaoba" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="50%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="wood-t-bancopercherocaoba" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="70%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="linen-bancopercherocaoba" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#E8E0D2"/>
      <stop offset="100%" stop-color="#B8AB99"/>
    </linearGradient>

    <linearGradient id="metal-bancopercherocaoba" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A6273"/>
      <stop offset="45%" stop-color="#39404F"/>
      <stop offset="100%" stop-color="#20242E"/>
    </linearGradient>

    <radialGradient id="spot-bancopercherocaoba" cx="0.42" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain-bancopercherocaoba" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.035" numOctaves="4" seed="7" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g2" mode="multiply"/>
    </filter>

    <filter id="soft-bancopercherocaoba" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="blur-sm-bancopercherocaoba" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="drop-bancopercherocaoba" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4A3A28" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg-bancopercherocaoba)"/>
  <rect width="1200" height="1200" fill="url(#spot-bancopercherocaoba)"/>
  <g>
    <ellipse cx="600" cy="890" rx="330" ry="38" fill="#6B543A" opacity="0.28" filter="url(#blur-sm-bancopercherocaoba)"/>
    <g filter="url(#drop-bancopercherocaoba)">
      <rect x="300" y="540" width="600" height="34" rx="10" fill="url(#wood-t-bancopercherocaoba)"/>
      <rect x="300" y="540" width="600" height="34" rx="10" fill="url(#wood-t-bancopercherocaoba)" filter="url(#grain-bancopercherocaoba)"/>
      <rect x="330" y="574" width="26" height="300" rx="9" fill="url(#wood-bancopercherocaoba)"/>
      <rect x="844" y="574" width="26" height="300" rx="9" fill="url(#wood-bancopercherocaoba)"/>
      <rect x="330" y="574" width="26" height="300" rx="9" fill="url(#wood-bancopercherocaoba)" filter="url(#grain-bancopercherocaoba)"/>
      <rect x="844" y="574" width="26" height="300" rx="9" fill="url(#wood-bancopercherocaoba)" filter="url(#grain-bancopercherocaoba)"/>
      <!-- respaldo -->
      <rect x="330" y="360" width="540" height="26" rx="10" fill="url(#wood-bancopercherocaoba)"/>
      <rect x="360" y="386" width="18" height="156" rx="8" fill="url(#wood-bancopercherocaoba)"/>
      <rect x="822" y="386" width="18" height="156" rx="8" fill="url(#wood-bancopercherocaoba)"/>
    </g>
    <!-- colgado -->
    <path d="M470 400 L520 400 L512 520 L478 520 Z" fill="#B8AB99" opacity="0.9"/>
    <path d="M600 400 L650 400 L642 500 L608 500 Z" fill="#8C6A4E" opacity="0.85"/>
  </g>
</svg>