<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  
  <defs>
    <linearGradient id="bg-estanteriapinomodular" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="60%" stop-color="#F1EBE1"/>
      <stop offset="100%" stop-color="#E5DDD0"/>
    </linearGradient>

    <linearGradient id="wood-estanteriapinomodular" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="55%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="wood-h-estanteriapinomodular" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="50%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="wood-t-estanteriapinomodular" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="70%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="linen-estanteriapinomodular" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#E8E0D2"/>
      <stop offset="100%" stop-color="#B8AB99"/>
    </linearGradient>

    <linearGradient id="metal-estanteriapinomodular" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A6273"/>
      <stop offset="45%" stop-color="#39404F"/>
      <stop offset="100%" stop-color="#20242E"/>
    </linearGradient>

    <radialGradient id="spot-estanteriapinomodular" cx="0.42" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain-estanteriapinomodular" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.035" numOctaves="4" seed="7" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g2" mode="multiply"/>
    </filter>

    <filter id="soft-estanteriapinomodular" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="blur-sm-estanteriapinomodular" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="drop-estanteriapinomodular" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4A3A28" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg-estanteriapinomodular)"/>
  <rect width="1200" height="1200" fill="url(#spot-estanteriapinomodular)"/>
  <g>
    <ellipse cx="600" cy="900" rx="350" ry="40" fill="#6B543A" opacity="0.28" filter="url(#blur-sm-estanteriapinomodular)"/>
    <g filter="url(#drop-estanteriapinomodular)">
      <rect x="270" y="220" width="120" height="650" rx="8" fill="url(#wood-estanteriapinomodular)"/>
      <rect x="810" y="220" width="120" height="650" rx="8" fill="url(#wood-estanteriapinomodular)"/>
      <rect x="270" y="220" width="120" height="650" rx="8" fill="url(#wood-estanteriapinomodular)" filter="url(#grain-estanteriapinomodular)"/>
      <rect x="810" y="220" width="120" height="650" rx="8" fill="url(#wood-estanteriapinomodular)" filter="url(#grain-estanteriapinomodular)"/>
      
        <rect x="270" y="250" width="660" height="26" rx="6" fill="url(#wood-t-estanteriapinomodular)"/>
        <rect x="270" y="250" width="660" height="26" rx="6" fill="url(#wood-t-estanteriapinomodular)" filter="url(#grain-estanteriapinomodular)"/>
        <rect x="270" y="376" width="660" height="26" rx="6" fill="url(#wood-t-estanteriapinomodular)"/>
        <rect x="270" y="376" width="660" height="26" rx="6" fill="url(#wood-t-estanteriapinomodular)" filter="url(#grain-estanteriapinomodular)"/>
        <rect x="270" y="502" width="660" height="26" rx="6" fill="url(#wood-t-estanteriapinomodular)"/>
        <rect x="270" y="502" width="660" height="26" rx="6" fill="url(#wood-t-estanteriapinomodular)" filter="url(#grain-estanteriapinomodular)"/>
        <rect x="270" y="628" width="660" height="26" rx="6" fill="url(#wood-t-estanteriapinomodular)"/>
        <rect x="270" y="628" width="660" height="26" rx="6" fill="url(#wood-t-estanteriapinomodular)" filter="url(#grain-estanteriapinomodular)"/>
        <rect x="270" y="754" width="660" height="26" rx="6" fill="url(#wood-t-estanteriapinomodular)"/>
        <rect x="270" y="754" width="660" height="26" rx="6" fill="url(#wood-t-estanteriapinomodular)" filter="url(#grain-estanteriapinomodular)"/>
    </g>
    <!-- libros -->
    <rect x="320" y="290" width="34" height="78" rx="4" fill="#8C4A3F"/><rect x="358" y="290" width="26" height="78" rx="4" fill="#3E5C6B"/><rect x="388" y="290" width="30" height="78" rx="4" fill="#6B7A4A"/><rect x="640" y="416" width="40" height="78" rx="4" fill="#7A5C86"/><rect x="686" y="416" width="28" height="78" rx="4" fill="#B08A4E"/><rect x="350" y="542" width="30" height="78" rx="4" fill="#4A5E7A"/><rect x="386" y="542" width="34" height="78" rx="4" fill="#7E5A3C"/><rect x="660" y="542" width="32" height="78" rx="4" fill="#5A7A62"/>
  </g>
</svg>