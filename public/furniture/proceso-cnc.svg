<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  
  <defs>
    <linearGradient id="bg-procesocnc" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="60%" stop-color="#F1EBE1"/>
      <stop offset="100%" stop-color="#E5DDD0"/>
    </linearGradient>

    <linearGradient id="wood-procesocnc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="55%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="wood-h-procesocnc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="50%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="wood-t-procesocnc" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="70%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="linen-procesocnc" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#E8E0D2"/>
      <stop offset="100%" stop-color="#B8AB99"/>
    </linearGradient>

    <linearGradient id="metal-procesocnc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A6273"/>
      <stop offset="45%" stop-color="#39404F"/>
      <stop offset="100%" stop-color="#20242E"/>
    </linearGradient>

    <radialGradient id="spot-procesocnc" cx="0.42" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain-procesocnc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.035" numOctaves="4" seed="7" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g2" mode="multiply"/>
    </filter>

    <filter id="soft-procesocnc" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="blur-sm-procesocnc" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="drop-procesocnc" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4A3A28" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg-procesocnc)"/>
  <rect width="1200" height="1200" fill="url(#spot-procesocnc)"/>
  <g>
    <ellipse cx="600" cy="900" rx="380" ry="42" fill="#6B543A" opacity="0.28" filter="url(#blur-sm-procesocnc)"/>
    <g filter="url(#drop-procesocnc)">
      <rect x="240" y="600" width="720" height="60" rx="10" fill="url(#metal-procesocnc)"/>
      <rect x="240" y="600" width="720" height="60" rx="10" fill="url(#metal-procesocnc)" filter="url(#grain-procesocnc)"/>
      <rect x="300" y="660" width="40" height="230" rx="8" fill="#20242E"/>
      <rect x="860" y="660" width="40" height="230" rx="8" fill="#20242E"/>
    </g>
    <!-- cabezal -->
    <rect x="500" y="300" width="200" height="230" rx="14" fill="url(#metal-procesocnc)"/>
    <rect x="530" y="340" width="140" height="90" rx="8" fill="#20242E"/>
    <rect x="586" y="530" width="28" height="70" rx="6" fill="#5A6273"/>
    <!-- panel -->
    <rect x="380" y="560" width="440" height="40" rx="6" fill="url(#wood-t-procesocnc)"/>
    <!-- vias -->
    <circle cx="520" cy="600" r="18" fill="none" stroke="#5FD3C4" stroke-width="5" opacity="0.9"/>
    <circle cx="680" cy="600" r="18" fill="none" stroke="#5FD3C4" stroke-width="5" opacity="0.9"/>
  </g>
</svg>