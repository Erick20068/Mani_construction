<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  
  <defs>
    <linearGradient id="bg-sofamodularroble" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="60%" stop-color="#F1EBE1"/>
      <stop offset="100%" stop-color="#E5DDD0"/>
    </linearGradient>

    <linearGradient id="wood-sofamodularroble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="55%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="wood-h-sofamodularroble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="50%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="wood-t-sofamodularroble" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#C8A165"/>
      <stop offset="70%" stop-color="#A97B42"/>
      <stop offset="100%" stop-color="#7C5629"/>
    </linearGradient>

    <linearGradient id="linen-sofamodularroble" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#E8E0D2"/>
      <stop offset="100%" stop-color="#B8AB99"/>
    </linearGradient>

    <linearGradient id="metal-sofamodularroble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A6273"/>
      <stop offset="45%" stop-color="#39404F"/>
      <stop offset="100%" stop-color="#20242E"/>
    </linearGradient>

    <radialGradient id="spot-sofamodularroble" cx="0.42" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain-sofamodularroble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.035" numOctaves="4" seed="7" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g2" mode="multiply"/>
    </filter>

    <filter id="soft-sofamodularroble" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="blur-sm-sofamodularroble" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="drop-sofamodularroble" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4A3A28" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg-sofamodularroble)"/>
  <rect width="1200" height="1200" fill="url(#spot-sofamodularroble)"/>
  <g>
    <ellipse cx="600" cy="880" rx="400" ry="52" fill="#6B543A" opacity="0.32" filter="url(#blur-sm-sofamodularroble)"/>
    <g filter="url(#drop-sofamodularroble)">
      <!-- respaldo -->
      <rect x="250" y="440" width="700" height="200" rx="26" fill="url(#wood-sofamodularroble)"/>
      <rect x="250" y="440" width="700" height="200" rx="26" fill="url(#wood-sofamodularroble)" filter="url(#grain-sofamodularroble)"/>
      <!-- cojines de respaldo -->
      <rect x="278" y="392" width="200" height="140" rx="20" fill="url(#linen-sofamodularroble)"/>
      <rect x="490" y="392" width="200" height="140" rx="20" fill="url(#linen-sofamodularroble)"/>
      <rect x="702" y="392" width="200" height="140" rx="20" fill="url(#linen-sofamodularroble)"/>
      <!-- brazos -->
      <rect x="206" y="470" width="72" height="230" rx="22" fill="url(#wood-t-sofamodularroble)"/>
      <rect x="922" y="470" width="72" height="230" rx="22" fill="url(#wood-t-sofamodularroble)"/>
      <!-- asiento -->
      <rect x="258" y="620" width="684" height="110" rx="24" fill="url(#linen-sofamodularroble)"/>
      <rect x="258" y="620" width="684" height="110" rx="24" fill="url(#wood-sofamodularroble)" opacity="0.05"/>
      <line x1="486" y1="628" x2="486" y2="722" stroke="#B8AB99" stroke-width="2" opacity="0.6"/>
      <line x1="714" y1="628" x2="714" y2="722" stroke="#B8AB99" stroke-width="2" opacity="0.6"/>
      <!-- base -->
      <rect x="270" y="730" width="660" height="46" rx="12" fill="url(#wood-sofamodularroble)"/>
      <rect x="270" y="730" width="660" height="46" rx="12" fill="url(#wood-sofamodularroble)" filter="url(#grain-sofamodularroble)"/>
    </g>
    <!-- patas metalicas -->
    <rect x="292" y="776" width="18" height="76" rx="6" fill="url(#metal-sofamodularroble)"/>
    <rect x="890" y="776" width="18" height="76" rx="6" fill="url(#metal-sofamodularroble)"/>
    <!-- manta decorativa -->
    <path d="M760 400 L920 400 L900 470 L775 470 Z" fill="#8A6132" opacity="0.5"/>
  </g>
</svg>